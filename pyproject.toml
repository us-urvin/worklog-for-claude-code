[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
# Distribution name on PyPI. The command stays `claude-worklog` and the package stays `worklog`.
name = "worklog-for-claude-code"
version = "0.1.0"
description = "Daily work log and token report across Claude Code accounts and devices, synced through your own private git repo"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Urvin" }]
keywords = ["claude-code", "claude", "worklog", "time-tracking", "token-usage", "developer-tools", "daily-report"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Topic :: Utilities",
]
# Standard library only, except a TOML parser on Python 3.10 (Ubuntu 22.04).
dependencies = ['tomli>=2.0; python_version < "3.11"']

[project.optional-dependencies]
test = ["pytest>=7"]
dev = ["pytest>=7", "ruff==0.16.9", "build"]

[project.urls]
Homepage = "https://github.com/us-urvin/worklog-for-claude-code"
Source = "https://github.com/us-urvin/worklog-for-claude-code"
Issues = "https://github.com/us-urvin/worklog-for-claude-code/issues"
Changelog = "https://github.com/us-urvin/worklog-for-claude-code/blob/main/CHANGELOG.md"

[project.scripts]
claude-worklog = "worklog.cli:main"

[tool.setuptools.packages.find]
include = ["worklog*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
# Pinned explicitly so results don't change when ruff's defaults do.
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# web.py renders pages from inline HTML templates; wrapping them would change the markup.
"worklog/web.py" = ["E501"]
