name: Scorecard

# OpenSSF Scorecard: an independent, automatic check of this repository's security practices
# (pinned dependencies, token permissions, signed releases, branch protection, ...).
# Results: https://scorecard.dev/viewer/?uri=github.com/us-urvin/worklog-for-claude-code
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"  # weekly, Monday 03:17 UTC
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      security-events: write  # upload the results to the Security tab
      id-token: write  # publish the results so the README badge can show them
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
