name: Bug report
description: Something doesn't work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! **Please remove personal information** (names, e-mails, account ids, hostnames,
        project names, paths under your home folder) from everything you paste below.
        Security problems go to the [private reporting form](https://github.com/us-urvin/worklog-for-claude-code/security/advisories/new) instead.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `claude-worklog ...`
        2. ...
  - type: input
    id: os
    attributes:
      label: OS and version
      placeholder: Ubuntu 24.04
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      description: Output of `python3 --version`
      placeholder: Python 3.12.3
    validations:
      required: true
  - type: input
    id: claude
    attributes:
      label: Claude Code version
      description: Output of `claude --version`
    validations:
      required: true
  - type: input
    id: worklog
    attributes:
      label: worklog-for-claude-code version
      description: Output of `claude-worklog --version`
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: "`claude-worklog doctor` output (personal info removed)"
      description: E-mails are already masked, but please also replace paths, device and account names if you prefer.
      render: text
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant log lines (optional, personal info removed)
      description: From `~/.local/state/claude-worklog/worklog.log` or `journalctl --user -u claude-worklog-web`
      render: text
